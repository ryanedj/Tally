[workspace]
members = [
    "tally-core",
    "fake-api",
    "proxy",
    "fake-program",
    "checker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"         

[workspace.lints.clippy]
unwrap_used = "warn"            
indexing_slicing = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "time"] }
httparse = "1"
thiserror= "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.11"
